<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Redirecting | Qode27</title>
    <meta name="theme-color" content="#05070c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, sans-serif;
        background: radial-gradient(circle at 70% 0%, rgba(76, 141, 255, 0.18), transparent 40%), #05070c;
        color: #eef1f6;
        padding: 24px;
      }
      main {
        max-width: 36rem;
      }
      p {
        color: #a1aabb;
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        margin-top: 16px;
        padding: 12px 20px;
        border-radius: 999px;
        background: #eef1f6;
        color: #05070c;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
    <script>
      // Static hosts serve this file for unknown paths. Hand the path to the single-page app,
      // which renders the matching route or its own branded not-found page.
      sessionStorage.setItem('qode27.redirect', window.location.pathname + window.location.search + window.location.hash)
      window.location.replace('/')
    </script>
  </head>
  <body>
    <main>
      <h1>Opening the right page…</h1>
      <p>If you are not redirected automatically, continue to the Qode27 homepage.</p>
      <a href="/">Go to homepage</a>
    </main>
  </body>
</html>
